queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - -closed
      - -draft
      - base = main
    merge_method: squash
pull_request_rules:
  - name: Label conflicting pull requests
    description: Add a label to a pull request with conflict to spot it easily
    conditions:
      - conflict
      - -closed
    actions:
      label:
        toggle:
          - conflict
  - name: Make sure PR are update before merging with rebase
    description: Rebase automerge-labeled PRs that are far behind. Restricted so
      the rest of the open-PR pile is not constantly rebased.
    conditions:
      - -closed
      - label = automerge
      - '#commits-behind >= 10'
    actions:
      rebase:
  - name: Assign t-shirt size to PR
    description: Assign a t-shirt size label to a pull request based on the number
      of lines changed.
    conditions:
      - '#modified-lines >= 100'
      - '#modified-lines < 500'
    actions:
      label:
        toggle:
          - size/L
  - name: Make sure PR are up to date before merging
    description: Update automerge-labeled PRs when they are slightly behind.
      Restricted so the rest of the open-PR pile is not constantly updated.
    conditions:
      - -closed
      - label = automerge
      - '#commits-behind > 0'
      - '#commits-behind < 10'
    actions:
      update: